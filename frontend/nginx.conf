# Fase 7 — camada de borda: o Nginx é o único ponto exposto ao navegador.
# Defesa em profundidade: limita a taxa no proxy (antes de chegar ao Spring),
# esconde a versão do servidor e manda os cabeçalhos de segurança do navegador.

# 10 requisições/min por IP em /api/auth/ (o back-end ainda aplica 5/min por IP
# na aplicação); 20 req/s por IP no resto da API, com folga para rajadas.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # não anuncia a versão do Nginx
    client_max_body_size 6m;      # igual ao limite de upload do Spring (foto de 5 MB)

    # Cabeçalhos de segurança (valem para o SPA e para as respostas da API)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # CSP em modo relatório: lista exatamente as origens que o front usa (mapa, CEP,
    # geocodificação, fontes). Depois de validada em produção, troca-se para
    # "Content-Security-Policy" (bloqueante). Com HTTPS, somar Strict-Transport-Security.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; connect-src 'self' https://viacep.com.br https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Login e cadastro: alvo de força bruta
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # o back-end usa para o rate limit por cliente
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy das chamadas de API para o Spring Boot
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — sempre devolve o index.html para as rotas do React
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
