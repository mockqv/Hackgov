services:

  # ── ORACLE — banco de dados ─────────────────────────────────
  oracle-hackgov:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-hackgov
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: hackgov123
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── BACKEND — Spring Boot ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: hackgov-backend
    ports:
      # host 8081 -> container 8080 (8080 do host fica livre pro Oracle APEX/outros)
      - "8081:8080"
    environment:
      ORACLE_URL: jdbc:oracle:thin:@oracle-hackgov:1521/XEPDB1
      ORACLE_USER: hackgov
      ORACLE_PASS: hackgov123
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      oracle-hackgov:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── FRONTEND — React + Vite ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: hackgov-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  oracle-data:
    external: true
